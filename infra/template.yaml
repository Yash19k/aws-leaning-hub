AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Learning Hub - static site hosting. A private S3 bucket behind CloudFront
  (Origin Access Control), a CloudFront Function for pre-rendered routes, SPA
  fallback for client-side routes, and a least-privilege IAM role that GitHub
  Actions assumes with OIDC (no long-lived access keys).

Parameters:
  GitHubRepo:
    Type: String
    Default: Yash19k/aws-learning-hub
    Description: owner/name of the GitHub repository allowed to deploy
  GitHubBranch:
    Type: String
    Default: main
    Description: Only workflows running on this branch can assume the deploy role
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      An account can have only one OIDC provider for token.actions.githubusercontent.com.
      Set to false if it already exists and pass its ARN in ExistingGitHubOidcProviderArn.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN of an existing GitHub OIDC provider (only when CreateGitHubOidcProvider=false)

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # ---------------------------------------------------------------- S3: private storage for the built site
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Only this CloudFront distribution may read objects. Nobody can list the bucket,
  # so a missing key returns 403, which CloudFront turns into the SPA's index.html.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ---------------------------------------------------------------- CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Signs CloudFront requests to the private site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # /projects/dropvault  ->  /projects/dropvault/index.html (pages pre-rendered at build time).
  # Paths with a file extension (/assets/index-3f9a.js) pass through unchanged.
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html to extension-less paths
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AWS Learning Hub
        HttpVersion: http2and3
        IPV6Enabled: true
        # PriceClass_200 includes edge locations in India. TODO(verify) current price class regions.
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized": honours the Cache-Control header each file is uploaded
          # with (1 year for hashed assets, revalidate for HTML; see scripts/deploy-site.ts).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # AWS managed "SecurityHeadersPolicy" (HSTS, X-Content-Type-Options, frame options...).
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        # SPA fallback: any unknown path serves the app shell, and React Router shows the page (or its 404).
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        # ---------------- Optional custom domain ----------------
        # 1. Request an ACM certificate for your domain in us-east-1 (CloudFront only uses
        #    certificates from us-east-1) and validate it with DNS.
        # 2. Uncomment and fill in:
        # Aliases:
        #   - learn.example.com
        # ViewerCertificate:
        #   AcmCertificateArn: arn:aws:acm:us-east-1:123456789012:certificate/xxxxxxxx
        #   SslSupportMethod: sni-only
        #   MinimumProtocolVersion: TLSv1.2_2021
        # 3. Point a CNAME (or Route 53 alias record) for the domain at the distribution's domain name.

  # ---------------------------------------------------------------- GitHub Actions deploy role (OIDC)
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Kept for older tooling; AWS verifies GitHub's tokens without it. TODO(verify)
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions to publish the site (sync bucket + invalidate CloudFront)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidc, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: WriteSiteObjects
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Sid: InvalidateCache
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'

Outputs:
  SiteUrl:
    Description: Open this in your browser
    Value: !Sub 'https://${Distribution.DomainName}'
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN variable in the GitHub repository
    Value: !GetAtt DeployRole.Arn
